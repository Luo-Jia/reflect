services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mental_health_db
    environment:
      POSTGRES_DB: research_db
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - research_data:/var/lib/postgresql/data

volumes:
  research_data:
